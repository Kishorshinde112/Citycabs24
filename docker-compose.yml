services:
  citycabs24:
    build:
      context: .
    image: citycabs24:latest
    container_name: citycabs24
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    networks:
      - dokploy-network
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.citycabs24-http.entrypoints=web"
      - "traefik.http.routers.citycabs24-http.rule=Host(`cabs.kishorlab.dev`)"
      - "traefik.http.routers.citycabs24-http.service=citycabs24-svc"
      - "traefik.http.routers.citycabs24-https.entrypoints=websecure"
      - "traefik.http.routers.citycabs24-https.rule=Host(`cabs.kishorlab.dev`)"
      - "traefik.http.routers.citycabs24-https.service=citycabs24-svc"
      - "traefik.http.routers.citycabs24-https.tls=true"
      - "traefik.http.services.citycabs24-svc.loadbalancer.server.port=80"

networks:
  dokploy-network:
    external: true
  coolify:
    external: true
