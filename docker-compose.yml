services:
  citycabs24:
    build:
      context: .
    image: citycabs24:latest
    container_name: citycabs24
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HOSTNAME=0.0.0.0
    volumes:
      - ./data:/app/data
      - ./public/media:/app/public/media
    networks:
      - dokploy-network
      - coolify
    ports:
      - "127.0.0.1:8099:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.citycabs24-http.entrypoints=web"
      - "traefik.http.routers.citycabs24-http.rule=Host(`citycabs24.com`) || Host(`www.citycabs24.com`)"
      - "traefik.http.routers.citycabs24-http.service=citycabs24-svc"
      - "traefik.http.routers.citycabs24-http.middlewares=redirect-to-https@file"
      - "traefik.http.routers.citycabs24-https.entrypoints=websecure"
      - "traefik.http.routers.citycabs24-https.rule=Host(`citycabs24.com`) || Host(`www.citycabs24.com`)"
      - "traefik.http.routers.citycabs24-https.service=citycabs24-svc"
      - "traefik.http.routers.citycabs24-https.tls=true"
      - "traefik.http.routers.citycabs24-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.citycabs24-svc.loadbalancer.server.port=3000"

networks:
  dokploy-network:
    external: true
  coolify:
    external: true
